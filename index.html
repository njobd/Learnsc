<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>learnflow - Modern Messaging</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>

    <!-- ── Auth Screen ─────────────────────────────────── -->
    <div id="authContainer" class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">learnflow</h1>
          <p class="auth-subtitle">Sign in to start messaging</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginUsername">Username</label>
            <input
              class="form-input"
              id="loginUsername"
              type="text"
              placeholder="Enter your username"
              autocomplete="username"
              required
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <input
              class="form-input"
              id="loginPassword"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn btn-primary" type="submit">Sign In</button>
        </form>
      </div>
    </div>

    <!-- ── Main App ────────────────────────────────────── -->
    <div id="appContainer" class="app-container">
      <header class="app-header">
        <span class="app-title">ChatFlow</span>
        <div class="user-info">
          <div class="user-details">
            <span id="currentUsername"></span>
          </div>
          <button class="btn btn-secondary" id="logoutBtn" type="button">Sign Out</button>
        </div>
      </header>

      <main id="messagesContainer"></main>

      <form id="messageForm">
        <input
          id="messageInput"
          type="text"
          placeholder="Type a message..."
          autocomplete="off"
          required
        />
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
    </div>

    <!-- ── Overlays ────────────────────────────────────── -->
    <div id="notify"></div>
    <div id="connectionStatus">Checking connection...</div>

    <!-- ── Scripts ────────────────────────────────────── -->
    <script type="module" src="/src/main.js"></script>

  </body>
</html>
